  <line x1="1198" y1="379" x2="1130" y2="379" stroke="#59687f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dependency-arrow)"/>
  <line x1="1338" y1="420" x2="1338" y2="432" stroke="#59687f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dependency-arrow)"/>
  <line x1="1338" y1="514" x2="1338" y2="526" stroke="#59687f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dependency-arrow)"/>
  <path d="M 1340 814 C 1340 790, 1340 790, 1340 778" fill="none" stroke="#59687f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dependency-arrow)"/>
