  <text x="1080" y="638" text-anchor="middle" fill="#147d78" font-family="Arial, sans-serif" font-size="12" font-weight="700">event flow</text>

  <rect x="52" y="934" width="1470" height="24" rx="12" fill="#f7f9fc"/>
  <text x="787" y="952" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">Dashed arrows: package dependency / implementation · solid teal arrow: runtime event flow</text>
</svg>
