    <rect x="1198" y="338" width="280" height="82" rx="10" fill="#ffffff" stroke="#b7601c" stroke-width="2"/>
    <text x="1338" y="370" text-anchor="middle" fill="#17243b" font-family="Arial, sans-serif" font-size="16" font-weight="700">persistence/entity/</text>
    <text x="1338" y="396" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">JPA / persistence entities</text>
    <rect x="1198" y="440" width="280" height="74" rx="10" fill="#ffffff" stroke="#d8e0eb" stroke-width="2"/>
    <text x="1338" y="470" text-anchor="middle" fill="#17243b" font-family="Arial, sans-serif" font-size="16" font-weight="700">persistence/repository/</text>
    <text x="1338" y="494" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">Spring Data repositories</text>
    <rect x="1198" y="534" width="134" height="74" rx="10" fill="#ffffff" stroke="#d8e0eb" stroke-width="2"/>
    <text x="1265" y="564" text-anchor="middle" fill="#17243b" font-family="Arial, sans-serif" font-size="16" font-weight="700">mapper/</text>
    <text x="1265" y="588" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">Conversions</text>
    <rect x="1344" y="534" width="134" height="74" rx="10" fill="#ffffff" stroke="#d8e0eb" stroke-width="2"/>
    <text x="1411" y="564" text-anchor="middle" fill="#17243b" font-family="Arial, sans-serif" font-size="16" font-weight="700">messaging/</text>
    <text x="1411" y="588" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">Event adapters</text>
    <text x="1338" y="698" text-anchor="middle" fill="#b7601c" font-family="Arial, sans-serif" font-size="13" font-weight="700">Implements port.out</text>
  </g>

  <g>
    <rect x="1168" y="814" width="340" height="96" rx="14" fill="#f1ebfb" stroke="#6946a5" stroke-width="3"/>
    <path d="M 1168 844 L 1168 814 L 1300 814 L 1320 834 L 1410 834 L 1410 844 Z" fill="#6946a5"/>
    <text x="1188" y="837" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">config</text>
    <text x="1338" y="875" text-anchor="middle" fill="#17243b" font-family="Arial, sans-serif" font-size="15" font-weight="700">Bean wiring · Security · OpenAPI</text>
    <text x="1338" y="897" text-anchor="middle" fill="#59687f" font-family="Arial, sans-serif" font-size="13">Framework configuration only</text>
  </g>

