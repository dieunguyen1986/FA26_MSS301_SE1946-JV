server:
  port: 8083

spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:5432/application_sdb
    driver-class-name: org.postgresql.Driver
    username: dieunt
    password:
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect