name: talenthub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/ats-realm.json:/opt/keycloak/data/import/ats-realm.json:ro

  config-server:
    build:
      context: .
      args:
        SERVICE_MODULE: infras/config-server
        SERVICE_ARTIFACT: config-server
    environment:
      CONFIG_SERVER_PROFILE: native
      CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    restart: on-failure

  eureka-server:
    build:
      context: .
      args:
        SERVICE_MODULE: infras/eureka-server
        SERVICE_ARTIFACT: eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    restart: on-failure

  job-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services/job-service
        SERVICE_ARTIFACT: job-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
      JOB_DB_URL: jdbc:postgresql://postgres:5432/job_sdb
      JOB_DB_USERNAME: ${JOB_DB_USERNAME:?JOB_DB_USERNAME is required}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:?JOB_DB_PASSWORD is required}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure

  candidate-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services/candidate-service
        SERVICE_ARTIFACT: candidate-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
      CANDIDATE_DB_URL: jdbc:postgresql://postgres:5432/candidate_sdb
      CANDIDATE_DB_USERNAME: ${CANDIDATE_DB_USERNAME:?CANDIDATE_DB_USERNAME is required}
      CANDIDATE_DB_PASSWORD: ${CANDIDATE_DB_PASSWORD:?CANDIDATE_DB_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-ats-cv}
      CV_MAX_FILE_SIZE: ${CV_MAX_FILE_SIZE:-10MB}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      minio:
        condition: service_healthy
    restart: on-failure

  application-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services/application-service
        SERVICE_ARTIFACT: application-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
      APPLICATION_DB_URL: jdbc:postgresql://postgres:5432/application_sdb
      APPLICATION_DB_USERNAME: ${APPLICATION_DB_USERNAME:?APPLICATION_DB_USERNAME is required}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?APPLICATION_DB_PASSWORD is required}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      job-service:
        condition: service_started
      candidate-service:
        condition: service_started
    restart: on-failure

  cv-parse-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services/cv-parse-service
        SERVICE_ARTIFACT: cv-parse-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
      CV_PARSE_MODE: simulated
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-ats-cv}
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build:
      context: .
      args:
        SERVICE_MODULE: infras/api-gateway
        SERVICE_ARTIFACT: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
      APP_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/ats
      APP_OIDC_JWK_SET_URI: http://keycloak:8080/realms/ats/protocol/openid-connect/certs
      APP_CLIENT_ID: ${APP_CLIENT_ID:-ats-postman}
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
    restart: on-failure

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
