server:
  port: ${CV_PARSE_SERVICE_PORT:8085}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # A malformed/unprocessable message goes to the DLQ instead of looping forever.
        default-requeue-rejected: false

cv-parse:
  mode: ${CV_PARSE_MODE:simulated}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:ats-cv}

logging:
  level:
    fu.ats: INFO
